services:
  supabase-cli:
    build:
      context: .
      dockerfile: Dockerfile.supabase-cli
    profiles: [supabase]
    # `supabase start` checks the services through 127.0.0.1 on the machine
    # running Docker. Host networking makes that address refer to the host
    # instead of the temporary CLI container.
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["supabase"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVER_URL: ${SUPABASE_SERVER_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AUTH_MASTER_USERNAME: ${AUTH_MASTER_USERNAME:-}
      AUTH_MASTER_EMAIL: ${AUTH_MASTER_EMAIL:-}
      AUTH_MASTER_PASSWORD: ${AUTH_MASTER_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
